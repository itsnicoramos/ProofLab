# The same checks as scripts/ci.sh, on Linux, for every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres for the tutor memory tests (each test uses its own schema).
      tutor-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: prooflab
          POSTGRES_PASSWORD: prooflab-local
          POSTGRES_DB: prooflab_tutor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prooflab -d prooflab_tutor"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PROOFLAB_TUTOR_TEST_DATABASE_URL: postgresql://prooflab:prooflab-local@127.0.0.1:5433/prooflab_tutor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: scripts/ci.sh backend

  # The same backend checks on macOS. GitHub's macOS runners can't run service containers,
  # so the memory tests skip here; the Linux job above runs them.
  backend-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: scripts/ci.sh backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/ci.sh frontend
