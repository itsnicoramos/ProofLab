[project]
name = "prooflab"
version = "0.1.0"
description = "Deterministic, step-by-step checker for university math work. No AI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sympy>=1.13",
    "pydantic>=2.9",
    "pyobjc-framework-vision>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=11 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The repo tutor's memory in Postgres (SPEC §20): uv sync --extra tutor
tutor = ["psycopg[binary]>=3.2"]

[project.scripts]
prooflab-tutor = "prooflab.tutor:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prooflab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Vercel deployment (SPEC §18): the app object lives in index.py.
[tool.vercel]
entrypoint = "index:app"
